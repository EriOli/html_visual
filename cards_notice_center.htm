<style>
    html,
    body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden
    }

    .nc {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        font-family: Inter, 'Segoe UI', Roboto, sans-serif;
        background: #fff;
        border: 1px solid #e8eaed;
        border-radius: 14px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-sizing: border-box;
        overflow: hidden
    }

    .nc * {
        box-sizing: border-box
    }

    .nc .hd {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex: none;
        gap: 10px
    }

    .nc .ttl {
        color: #111827;
        font-weight: 700;
        font-size: 15px
    }

    .nc .pw {
        position: relative;
        flex: none
    }

    .nc .day {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 5px 8px 5px 10px;
        color: #374151;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
        white-space: nowrap
    }

    .nc .day:hover {
        background: #f8fafc
    }

    .nc .day svg {
        color: #9ca3af;
        transition: transform .2s;
        flex: none
    }

    .nc .pw.open .day svg {
        transform: rotate(180deg)
    }

    .nc .pm {
        display: none;
        position: absolute;
        right: 0;
        top: 34px;
        background: #fff;
        border: 1px solid #eef0f2;
        border-radius: 10px;
        box-shadow: 0 10px 28px rgba(15, 23, 42, .12);
        padding: 5px;
        min-width: 140px;
        z-index: 20
    }

    .nc .pw.open .pm {
        display: block
    }

    .nc .po {
        padding: 8px 10px;
        border-radius: 7px;
        font-size: 12.5px;
        color: #475569;
        cursor: pointer;
        white-space: nowrap
    }

    .nc .po:hover {
        background: #f8fafc
    }

    .nc .po.sel {
        background: #f1f5f9;
        color: #111827;
        font-weight: 500
    }

    .nc .list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 0 -4px;
        padding: 0 4px
    }

    .nc .list::-webkit-scrollbar {
        width: 0;
        height: 0
    }

    .nc .ni {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 11px;
        border-radius: 11px;
        border: 1.5px solid transparent;
        transition: border-color .15s, box-shadow .15s, background .15s
    }

    .nc .ni:hover {
        border-color: #cbd5e1;
        box-shadow: 0 5px 14px rgba(15, 23, 42, .1);
        background: #fff
    }

    .nc .nic {
        width: 36px;
        height: 36px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none
    }

    .nc .ntx {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px
    }

    .nc .ntit {
        color: #111827;
        font-weight: 600;
        font-size: 13px;
        line-height: 1.3
    }

    .nc .nsub {
        color: #6b7280;
        font-weight: 400;
        font-size: 11.5px;
        line-height: 1.45
    }

    .nc .nsub .nt {
        color: #9ca3af;
        white-space: nowrap
    }

    .nc .nempty {
        color: #9ca3af;
        font-size: 12.5px;
        text-align: center;
        padding: 24px 0
    }

    .nc .all {
        flex: none;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        color: #374151;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        background: #fff
    }

    .nc .all:hover {
        background: #f8fafc
    }
</style>
<div class='nc'>
    <div class='hd'><span class='ttl'>Central de Notificações</span>
        <div class='pw' id='npw'><button class='day' onclick='pTog()'><span id='nplbl'>Hoje</span><svg width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'>
                    <polyline points='6 9 12 15 18 9' />
                </svg></button>
            <div class='pm'>
                <div class='po sel' data-p='0' onclick='pPick(this)'>Hoje</div>
                <div class='po' data-p='1' onclick='pPick(this)'>Esta semana</div>
                <div class='po' data-p='2' onclick='pPick(this)'>Este mês</div>
                <div class='po' data-p='9' onclick='pPick(this)'>Tudo</div>
            </div>
        </div>
    </div>
    <div class='list' id='nlist'></div>
    <div class='all' id='nall' onclick='toggleAll()'>Ver Todas</div>
</div>
<script>
    var NOT = [
        ['warn', '#fee2e2', '#dc2626', 'Alerta de Estoque Baixo', 'Apenas 7 unidades de Fones de Ouvido Bluetooth', 'agora', 0],
        ['bag', '#fef3c7', '#d97706', 'Novo Pedido Recebido', 'Pedido 3636', '20/09/2025', 0],
        ['bag', '#fef3c7', '#d97706', 'Novo Pedido Recebido', 'Pedido 3635', '07/09/2025', 0],
        ['bag', '#fef3c7', '#d97706', 'Novo Pedido Recebido', 'Pedido 3634', '21/09/2025', 1],
        ['bag', '#fef3c7', '#d97706', 'Novo Pedido Recebido', 'Pedido 3633', '08/09/2025', 1],
        ['bag', '#fef3c7', '#d97706', 'Novo Pedido Recebido', 'Pedido 3632', '22/09/2025', 1],
        ['bag', '#fef3c7', '#d97706', 'Novo Pedido Recebido', 'Pedido 3631', '09/09/2025', 2],
        ['bag', '#fef3c7', '#d97706', 'Novo Pedido Recebido', 'Pedido 3630', '23/09/2025', 2],
        ['bag', '#fef3c7', '#d97706', 'Novo Pedido Recebido', 'Pedido 3629', '10/09/2025', 2],
        ['chat', '#dcfce7', '#16a34a', 'Avaliação Positiva', 'Ótimo atendimento e entrega rápida!', 'hoje', 0]
    ];
</script>
<script>
    var NL = document.getElementById('nlist'),
        NB = document.getElementById('nall'),
        NPL = document.getElementById('nplbl'),
        NPW = document.getElementById('npw');
    var PER = 0,
        EXP = false,
        LIM = 3;
    var ICONS = {
        bag: `<svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z'/><line x1='3' y1='6' x2='21' y2='6'/><path d='M16 10a4 4 0 0 1-8 0'/></svg>`,
        warn: `<svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z'/><line x1='12' y1='9' x2='12' y2='13'/><line x1='12' y1='17' x2='12.01' y2='17'/></svg>`,
        chat: `<svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z'/></svg>`
    };

    function pTog() {
        NPW.classList.toggle('open');
    }

    function pPick(el) {
        PER = +el.getAttribute('data-p');
        var o = document.querySelectorAll('.po');
        for (var j = 0; j < o.length; j++) {
            o[j].classList.toggle('sel', o[j] === el);
        }
        NPL.textContent = el.textContent;
        NPW.classList.remove('open');
        EXP = false;
        nR();
    }
    document.addEventListener('click', function(e) {
        if (!e.target.closest('#npw')) NPW.classList.remove('open');
    });

    function toggleAll() {
        EXP = !EXP;
        nR();
    }

    function nRow(n) {
        return `<div class='ni'><span class='nic' style='background:${n[1]};color:${n[2]}'>${ICONS[n[0]]}</span><div class='ntx'><span class='ntit' title='${n[3]}'>${n[3]}</span><span class='nsub'>${n[4]} <span class='nt'>· ${n[5]}</span></span></div></div>`;
    }

    function nR() {
        var vis = NOT.filter(function(n) {
            return n[6] <= PER;
        });
        var shown = EXP ? vis : vis.slice(0, LIM);
        NL.innerHTML = shown.length ? shown.map(nRow).join('') : `<div class='nempty'>Nenhuma notificação no período</div>`;
        if (vis.length > LIM) {
            NB.style.display = 'flex';
            NB.textContent = EXP ? 'Ver menos' : 'Ver Todas';
        } else {
            NB.style.display = 'none';
        }
    }
    nR();
</script>
