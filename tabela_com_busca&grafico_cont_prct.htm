<style>
    html,
    body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden
    }

    .ol {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        font-family: Inter, 'Segoe UI', Roboto, sans-serif;
        background: #fff;
        border: 1px solid #e8eaed;
        border-radius: 14px;
        padding: 14px 20px 10px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-sizing: border-box;
        overflow: hidden
    }

    .ol * {
        box-sizing: border-box
    }

    .ol .ttl {
        color: #111827;
        font-weight: 700;
        font-size: 16px;
        flex: none
    }

    .ol .tb {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: none
    }

    .ol .srch {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 9px;
        height: 40px;
        border: 1px solid #e5e7eb;
        border-radius: 9px;
        padding: 0 13px
    }

    .ol .srch svg {
        color: #9ca3af;
        flex: none
    }

    .ol .srch input {
        border: none;
        outline: none;
        background: transparent;
        font-size: 13px;
        color: #111827;
        width: 100%;
        font-family: inherit
    }

    .ol .srch input::placeholder {
        color: #9ca3af
    }

    .ol .vwrap {
        position: relative
    }

    .ol .vbtn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        border: 1px solid #e5e7eb;
        border-radius: 9px;
        padding: 0 11px;
        color: #374151;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        background: #fff;
        font-family: inherit;
        cursor: pointer
    }

    .ol .vbtn:hover {
        background: #f8fafc
    }

    .ol .vbtn .ap {
        color: #22c55e;
        display: flex
    }

    .ol .vbtn .cv {
        color: #9ca3af;
        display: flex;
        transition: transform .2s
    }

    .ol .vwrap.open .cv {
        transform: rotate(180deg)
    }

    .ol .vmenu {
        display: none;
        position: absolute;
        right: 0;
        top: 46px;
        background: #fff;
        border: 1px solid #eef0f2;
        border-radius: 12px;
        box-shadow: 0 10px 28px rgba(15, 23, 42, .12);
        padding: 5px;
        min-width: 190px;
        z-index: 21
    }

    .ol .vwrap.open .vmenu {
        display: block
    }

    .ol .vopt {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 11px;
        border-radius: 8px;
        font-size: 13px;
        color: #475569;
        cursor: pointer;
        white-space: nowrap
    }

    .ol .vopt svg {
        color: #22c55e;
        flex: none
    }

    .ol .vopt:hover {
        background: #f8fafc
    }

    .ol .vopt.sel {
        background: #f1f5f9;
        color: #111827;
        font-weight: 500
    }

    .ol .fwrap {
        position: relative
    }

    .ol .fbtn {
        width: 38px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #e5e7eb;
        border-radius: 9px;
        color: #64748b;
        cursor: pointer
    }

    .ol .fbtn:hover {
        background: #f8fafc
    }

    .ol .fwrap.open .fbtn {
        background: #ecfdf3;
        color: #16a34a;
        border-color: #bbf7d0
    }

    .ol .fmenu {
        display: none;
        position: absolute;
        right: 0;
        top: 46px;
        background: #fff;
        border: 1px solid #eef0f2;
        border-radius: 12px;
        box-shadow: 0 10px 28px rgba(15, 23, 42, .12);
        padding: 5px;
        min-width: 172px;
        z-index: 20
    }

    .ol .fwrap.open .fmenu {
        display: block
    }

    .ol .fhd {
        font-size: 11px;
        font-weight: 600;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: .04em;
        padding: 8px 10px 6px
    }

    .ol .fopt {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 13px;
        color: #475569;
        cursor: pointer
    }

    .ol .fopt:hover {
        background: #f8fafc
    }

    .ol .fopt.sel {
        background: #f1f5f9;
        color: #111827;
        font-weight: 500
    }

    .ol .fopt .d {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none
    }

    .ol .tbw {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        margin: 0 -4px;
        padding: 0 4px
    }

    .ol table {
        width: 100%;
        border-collapse: collapse
    }

    .ol thead th {
        text-align: left;
        color: #6b7280;
        font-size: 12px;
        font-weight: 500;
        padding: 9px 6px;
        border-bottom: 1px solid #eef0f3;
        white-space: nowrap;
        cursor: pointer;
        user-select: none
    }

    .ol thead th .sa {
        display: inline-flex;
        margin-left: 4px;
        color: #cbd5e1;
        vertical-align: -1px
    }

    .ol thead th.asc .sa,
    .ol thead th.desc .sa {
        color: #6b7280
    }

    .ol tbody td {
        padding: 13px 6px;
        font-size: 12px;
        border-bottom: 1px solid #f1f3f6;
        white-space: nowrap;
        color: #374151
    }

    .ol tbody tr:hover {
        background: #f9fafb
    }

    .ol .cn {
        font-weight: 600;
        color: #111827;
        width: 84px
    }

    .ol .cl {
        color: #374151;
        font-weight: 500
    }

    .ol .cd {
        color: #6b7280;
        width: 98px
    }

    .ol .ct {
        font-weight: 600;
        color: #111827;
        width: 84px
    }

    .ol .cs {
        width: 120px
    }

    .ol .bdg {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px 4px 8px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 600
    }

    .ol .bdg svg {
        flex: none
    }

    /* GRID 2 COLUNAS DO GRÁFICO (edição manual) */
    .ol .ogc {
        display: none;
        flex: 1;
        min-height: 0;
        flex-wrap: wrap;
        align-content: center;
        gap: 8px;
        padding: 4px 2px;
    }

    .ol .grow {
        flex: 1 1 calc(50% - 8px);
        background: #fff;
        border: 1px solid #f1f5f9;
        border-radius: 8px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
        box-sizing: border-box;
    }

    .ol .ghead {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
    }

    .ol .ghead .gdot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
    }

    .ol .ghead .gname {
        font-weight: 600;
        color: #111827;
        font-size: 13px;
    }

    .ol .ghead .gqt {
        flex: 1 1 100%;
        color: #64748b;
        font-size: 11.5px;
        line-height: 1.4;
        margin-top: 2px;
    }

    .ol .ghead .gqt b {
        color: #111827;
        font-size: 12.5px;
        font-weight: 600;
    }

    .ol .gtrack {
        height: 5px;
        background: #f1f5f9;
        border-radius: 4px;
        overflow: hidden;
        margin-top: 6px;
    }

    .ol .gfill {
        height: 100%;
        border-radius: 4px;
    }

    .ol .oe {
        display: none;
        text-align: center;
        color: #9ca3af;
        font-size: 13px;
        padding: 28px 0
    }

    .ol .ft {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #9ca3af;
        font-size: 12px;
        padding-top: 4px;
        gap: 10px;
        flex: none
    }

    .ol .pag {
        display: flex;
        align-items: center;
        gap: 5px
    }

    .ol .pg {
        min-width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 6px;
        border: 1px solid #e5e7eb;
        border-radius: 7px;
        font-size: 12px;
        color: #475569;
        cursor: pointer;
        user-select: none
    }

    .ol .pg:hover {
        background: #f8fafc
    }

    .ol .pg.on {
        background: #101010;
        color: #fff;
        border-color: #101010
    }

    .ol .pg.ar {
        color: #64748b
    }

    .ol .ell {
        padding: 0 2px;
        color: #94a3b8
    }
</style>

<script>
    var OB = document.getElementById('ob'),
        OS = document.getElementById('os'),
        OC = document.getElementById('oc'),
        OE = document.getElementById('oe'),
        OPG = document.getElementById('opg');
    var oF = '',
        oK = '',
        oD = 1,
        oView = 'table',
        oP = 1,
        PP = 8;
    var IG = `<svg width='15' height='15' viewBox='0 0 24 24' fill='currentColor'><rect x='3' y='3' width='7' height='7' rx='1.5'/><rect x='14' y='3' width='7' height='7' rx='1.5'/><rect x='3' y='14' width='7' height='7' rx='1.5'/><rect x='14' y='14' width='7' height='7' rx='1.5'/></svg>`;
    var IB = `<svg width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><line x1='12' y1='20' x2='12' y2='10'/><line x1='18' y1='20' x2='18' y2='4'/><line x1='6' y1='20' x2='6' y2='16'/></svg>`;
    var IHG = `<svg width='12' height='12' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 2h12M6 22h12M8 2v4l4 4 4-4V2M8 22v-4l4-4 4 4v4'/></svg>`;
    var ISP = `<svg width='12' height='12' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round'><path d='M21 12a9 9 0 1 1-6.2-8.5'/></svg>`;
    var ITR = `<svg width='12' height='12' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='1' y='5' width='14' height='11' rx='1'/><path d='M15 9h4l3 3v4h-7z'/><circle cx='6' cy='18' r='2'/><circle cx='18' cy='18' r='2'/></svg>`;
    var ICK = `<svg width='12' height='12' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>`;
    var SM = {
        Pendente: ['#fee2e2', '#dc2626', IHG],
        Processando: ['#dbeafe', '#2563eb', ISP],
        Enviado: ['#fef3c7', '#b45309', ITR],
        Entregue: ['#dcfce7', '#16a34a', ICK]
    };
    var SORD = ['Pendente', 'Processando', 'Enviado', 'Entregue'];

    function oFTog() {
        document.getElementById('ofw').classList.toggle('open');
    }

    function oFPick(el) {
        var s = el.getAttribute('data-s');
        oF = (s === 'todos' ? '' : s);
        var o = document.querySelectorAll('.fopt');
        for (var j = 0; j < o.length; j++) {
            o[j].classList.toggle('sel', o[j] === el);
        }
        document.getElementById('ofw').classList.remove('open');
        oP = 1;
        oR();
    }

    function vTog() {
        document.getElementById('ovw').classList.toggle('open');
    }

    function vPick(el) {
        var v = el.getAttribute('data-v');
        oView = v;
        var o = document.querySelectorAll('.vopt');
        for (var j = 0; j < o.length; j++) {
            o[j].classList.toggle('sel', o[j] === el);
        }
        document.getElementById('vlbl').textContent = (v === 'chart' ? 'Visão em Gráfico' : 'Visão em Tabela');
        document.getElementById('vicon').innerHTML = (v === 'chart' ? IB : IG);
        document.getElementById('ovw').classList.remove('open');
        document.getElementById('otbw').style.display = (v === 'chart' ? 'none' : 'flex');
        document.getElementById('ogc').style.display = (v === 'chart' ? 'flex' : 'none');
        oR();
    }
    document.addEventListener('click', function(e) {
        if (!e.target.closest('#ofw')) document.getElementById('ofw').classList.remove('open');
        if (!e.target.closest('#ovw')) document.getElementById('ovw').classList.remove('open');
    });

    function oVal(a, k) {
        if (k === 'num') return +a[0];
        if (k === 'total') return a[5];
        if (k === 'dt') return +a[6];
        if (k === 'cli') return a[1].toLowerCase();
        return a[4];
    }

    function oSort(el) {
        var k = el.getAttribute('data-k');
        if (oK === k) {
            oD = -oD;
        } else {
            oK = k;
            oD = 1;
        }
        var ths = document.querySelectorAll('.ol thead th');
        for (var j = 0; j < ths.length; j++) {
            ths[j].classList.remove('asc', 'desc');
        }
        el.classList.add(oD > 0 ? 'asc' : 'desc');
        oR();
    }

    function oFilt() {
        var q = OS.value.trim().toLowerCase();
        return ORD.filter(function(a) {
            var okq = !q || ('' + a[0]).indexOf(q) >= 0 || a[1].toLowerCase().indexOf(q) >= 0;
            var oks = !oF || a[4] === oF;
            return okq && oks;
        });
    }

    function oRow(a) {
        var m = SM[a[4]] || ['#eee', '#666', ''];
        return `<tr><td class='cn'>${a[0]}</td><td class='cl'>${a[1]}</td><td class='cd'>${a[2]}</td><td class='ct'>${a[3]}</td><td class='cs'><span class='bdg' style='background:${m[0]};color:${m[1]}'>${m[2]}${a[4]}</span></td></tr>`;
    }

    function oLst(tp) {
        var a = [];
        if (tp <= 7) {
            for (var i = 1; i <= tp; i++) a.push(i);
            return a;
        }
        a.push(1);
        var lo = Math.max(2, oP - 1),
            hi = Math.min(tp - 1, oP + 1);
        if (lo > 2) a.push('..');
        for (var i = lo; i <= hi; i++) a.push(i);
        if (hi < tp - 1) a.push('..');
        a.push(tp);
        return a;
    }

    function oGo(p) {
        oP = p;
        oR();
    }

    function oPager(tp) {
        var h = `<span class='pg ar' onclick='oGo(${Math.max(1,oP-1)})'>‹</span>`;
        var L = oLst(tp);
        for (var i = 0; i < L.length; i++) {
            if (L[i] === '..') {
                h += `<span class='ell'>…</span>`;
            } else {
                h += `<span class='pg${L[i]===oP?' on':''}' onclick='oGo(${L[i]})'>${L[i]}</span>`;
            }
        }
        h += `<span class='pg ar' onclick='oGo(${Math.min(tp,oP+1)})'>›</span>`;
        OPG.innerHTML = h;
    }

    function oGC(f) {
        var ag = {},
            mx = 1,
            tot = f.length;
        for (var i = 0; i < SORD.length; i++) ag[SORD[i]] = {
            c: 0,
            t: 0
        };
        for (var i = 0; i < f.length; i++) {
            var s = f[i][4];
            if (ag[s]) {
                ag[s].c++;
                ag[s].t += f[i][5];
            }
        }
        for (var i = 0; i < SORD.length; i++) {
            if (ag[SORD[i]].c > mx) mx = ag[SORD[i]].c;
        }
        var h = '';
        for (var i = 0; i < SORD.length; i++) {
            var nm = SORD[i],
                m = SM[nm],
                a = ag[nm];
            var w = Math.round(a.c / mx * 100);
            var pc = tot ? (a.c / tot * 100) : 0;
            var pcs = pc.toLocaleString('pt-BR', {
                minimumFractionDigits: 1,
                maximumFractionDigits: 1
            }) + '%';
            h += `<div class='grow'><div class='ghead'><span class='gdot' style='background:${m[1]}'></span><span class='gname'>${nm}</span><span class='gqt'><b>${a.c.toLocaleString('pt-BR')}</b> ${a.c===1?'pedido':'pedidos'} · ${pcs} · R$ ${a.t.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</span></div><div class='gtrack'><div class='gfill' style='width:${w}%;background:${m[1]}'></div></div></div>`;
        }
        document.getElementById('ogc').innerHTML = h;
    }

    function oFit(f) {
        var tbw = document.getElementById('otbw');
        var th = tbw.querySelector('thead');
        var thH = th ? th.offsetHeight : 36;
        var avail = Math.max(46, tbw.clientHeight - thH - 2);

        function paint(pp) {
            var tp = Math.max(1, Math.ceil(f.length / pp));
            if (oP > tp) oP = tp;
            if (oP < 1) oP = 1;
            var stt = (oP - 1) * pp;
            OB.innerHTML = f.slice(stt, stt + pp).map(oRow).join('');
            return [tp, stt];
        }
        var r = paint(Math.max(1, Math.floor(avail / 48)));
        var row = OB.querySelector('tr');
        if (row) {
            var rh = row.offsetHeight || 48;
            PP = Math.max(1, Math.floor(avail / rh));
            r = paint(PP);
        }
        OE.style.display = f.length ? 'none' : 'block';
        OC.textContent = f.length ? ('Mostrando ' + (r[1] + 1) + '–' + Math.min(r[1] + PP, f.length) + ' de ' + f.length.toLocaleString('pt-BR')) : 'Nenhum pedido';
        oPager(r[0]);
    }

    function oR() {
        var f = oFilt();
        if (oK) {
            f.sort(function(a, b) {
                var x = oVal(a, oK),
                    y = oVal(b, oK);
                return (x < y ? -1 : x > y ? 1 : 0) * oD;
            });
        }
        if (oView === 'chart') {
            oGC(f);
            OC.textContent = f.length.toLocaleString('pt-BR') + (f.length === 1 ? ' pedido' : ' pedidos');
            OPG.style.display = 'none';
            return;
        }
        OPG.style.display = 'flex';
        oFit(f);
    }
    OS.addEventListener('input', function() {
        oP = 1;
        oR();
    });
    window.addEventListener('resize', oR);
    setTimeout(oR, 60);
    oR();
</script>
