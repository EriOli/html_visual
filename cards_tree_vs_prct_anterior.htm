<style>
    /* 1. Zera margens e impede rolagem indesejada no Power BI */
    html,
    body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
    }

    .kpi {
        font-family: Inter, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        gap: 10px;
        /* Reduzi levemente o gap para dar mais respiro */
        padding: 2px;
        height: 100vh;
        /* 2. Ocupa exatamente a altura do contêiner que você dimensionou para 347px */
        overflow: hidden;
    }

    .kpi * {
        box-sizing: border-box;
    }

    .kpi .c {
        position: relative;
        background: #fff;
        border: 1px solid #efefef;
        border-radius: 12px;
        padding: 12px 16px;
        box-shadow: 0 1px 1px rgba(16, 24, 40, .04);
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex: 1;
        min-height: 0;
        /* 3. REGRA DE OURO: Força o card a respeitar o limite do flexbox e não vazar */
        gap: 4px;
    }

    .kpi .lbl {
        color: #6b7280;
        font-size: 12.5px;
        font-weight: 500;
    }

    .kpi .val {
        display: flex;
        align-items: baseline;
        gap: 3px;
        color: #111827;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: -0.44px;
    }

    .kpi .val small {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0;
    }

    .kpi .ft {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .kpi .bdg {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 3.5px 8px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 600;
    }

    .kpi .bdg .ar {
        font-size: 9px;
        line-height: 1;
    }

    .kpi .up {
        background: #dcfce7;
        color: #15803d;
    }

    .kpi .down {
        background: #fee2e2;
        color: #dc2626;
    }

    .kpi .vs {
        color: #9ca3af;
        font-size: 11px;
        font-weight: 400;
    }

    .kpi .chip {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        right: 15px;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: #dcfce7;
        display: flex;
        align-items: center;
        justify-content: center;
    }
</style>
